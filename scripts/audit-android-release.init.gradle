// Gradle init scripts are also applied to React Native's included build.
gradle.settingsEvaluated { settings ->
    if (settings.rootProject.name != 'PocketPal' || settings.settingsDir.name != 'android') {
        return
    }

    gradle.projectsEvaluated {
        def root = gradle.rootProject
        def app = root.findProject(':app')
        if (app == null) {
            throw new GradleException('PocketPal Android app project :app was not found')
        }

        app.tasks.register('auditPocketPalReleaseDependencies') {
            group = 'verification'
            description = 'Resolve external prodRelease artifacts and report AGP without compiling native code.'
            doLast {
                def runtime = app.configurations.findByName('prodReleaseRuntimeClasspath')
                if (runtime == null || !runtime.canBeResolved) {
                    throw new GradleException('prodReleaseRuntimeClasspath is missing or not resolvable')
                }
                println('POCKETPAL_CONFIG|' + runtime.name)

                // Local Android projects expose many AGP artifact variants (lint,
                // metadata, classes, resources). The native AAR audit only needs
                // external Maven modules; filtering before artifact selection
                // avoids ambiguous local-project variants while retaining
                // transitive external dependencies from those projects.
                def artifacts = runtime.incoming.artifactView { view ->
                    view.componentFilter { component ->
                        component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    }
                }.artifacts.artifacts

                if (artifacts.isEmpty()) {
                    throw new GradleException('No external artifacts resolved for ' + runtime.name)
                }
                artifacts.each { artifact ->
                    println('POCKETPAL_ARTIFACT|' + artifact.id.componentIdentifier.displayName + '|' + artifact.file.absolutePath)
                }

                def classpath = root.buildscript.configurations.findByName('classpath')
                if (classpath == null || !classpath.canBeResolved) {
                    throw new GradleException('Root buildscript classpath is unavailable')
                }
                def agp = classpath.resolvedConfiguration.resolvedArtifacts.findAll {
                    it.moduleVersion.id.group == 'com.android.tools.build' && it.name == 'gradle'
                }
                if (agp.size() != 1) {
                    throw new GradleException('Expected exactly one resolved AGP artifact; found ' + agp.size())
                }
                agp.each {
                    println('POCKETPAL_AGP|' + it.moduleVersion.id.version + '|' + it.file.absolutePath)
                }
            }
        }
    }
}
