
name: Build PocketPal Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - local-only-android

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

          # Android 17 SDK is published as android-37.0, while this project
          # declares compileSdkVersion 37 and Gradle looks for android-37.
          # Provide the expected directory name without copying the platform.
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create Android .env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$SUPABASE_URL" ] || missing+=(SUPABASE_URL)
          [ -n "$SUPABASE_ANON_KEY" ] || missing+=(SUPABASE_ANON_KEY)
          [ -n "$GOOGLE_WEB_CLIENT_ID" ] || missing+=(GOOGLE_WEB_CLIENT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Add the official PocketPal/PalsHub values under Settings > Secrets and variables > Actions."
            exit 1
          fi

          cat > .env <<EOL
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          PALSHUB_API_BASE_URL=https://palshub.ai
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          EOL

      - name: Build optimized release APK
        run: cd android && ./gradlew assembleProdRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-Android-APK
          path: android/app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          retention-days: 7
          
