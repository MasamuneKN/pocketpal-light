
name: Build PocketPal Android APK

on:
  # APK packaging is intentionally opt-in. The CI workflow already builds
  # Android only after lint, typecheck, and unit tests pass.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketpal-lite-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # llama.rn defaults to prebuilt libraries; the payload manifest requires
      # the patched source build and the Hexagon backend for the release ABI set.
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

          # Android 17 SDK is published as android-37.0, while this project
          # declares compileSdkVersion 37 and Gradle looks for android-37.
          # Provide the expected directory name without copying the platform.
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Keep this standalone manual route behind the same validation gates as CI.
      # No Gradle packaging step can run unless every check below succeeds.
      - name: Validate l10n files
        run: node scripts/validate-l10n.js

      - name: Verify font registration
        run: node scripts/verify-fonts.js

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript type check
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test --coverage

      - name: Validate Android payload manifest
        run: node scripts/verify-android-payload.js --print-variants

      - name: Derive the rnllama variant allowlist from the payload manifest
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk

      - name: Create Android .env file
        run: |
          cat > .env <<'EOL'
          FIREBASE_FUNCTIONS_URL=https://disabled.invalid
          APP_URL=pocketpal://app
          EOL

      - name: Create temporary CI release keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore pocketpal-release-key.keystore \
            -alias pocketpal_key_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass temporary-ci-password \
            -keypass temporary-ci-password \
            -dname "CN=CI Build, OU=CI, O=PocketPal, L=CI, S=CI, C=US"

      - name: Build optimized release APK
        env:
          APP_RELEASE_STORE_PASSWORD: temporary-ci-password
          APP_RELEASE_KEY_PASSWORD: temporary-ci-password
        run: |
          set -euo pipefail
          if [ "${ORG_GRADLE_PROJECT_rnllamaBuildFromSource:-}" != "true" ]; then
            echo "::error::llama.rn source build is required by the payload manifest."
            exit 1
          fi
          cd android
          ./gradlew assembleProdRelease --stacktrace --info 2>&1 | tee android-build.log

      - name: Verify rnllama variant allowlist reached the build
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          if ! grep -qF "Building rnllama variants: $VARIANTS" android/android-build.log; then
            echo "::error::llama.rn did not report building the declared variant list."
            grep -F "rnllama variants" android/android-build.log || true
            exit 1
          fi

      - name: Verify Android release payload
        run: |
          APK_PATH="$(find android/app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No production release APK was found to verify."
            exit 1
          fi
          node scripts/verify-android-payload.js --apk "$APK_PATH" --report android/android-payload-report.txt

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            android/android-build.log
            android/android-payload-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-Android-APK
          path: android/app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          retention-days: 7
          
