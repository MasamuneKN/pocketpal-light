name: Format PocketPal Lite and validate

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: pocketpal-lite-format-main
  cancel-in-progress: false

jobs:
  format-and-dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile

      - name: Apply repository Prettier formatting
        run: yarn format

      - name: Commit formatting changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes were needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: apply repository Prettier formatting"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch CI after an automated formatting commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
          echo "Dispatched CI for the automated formatting commit. Android packaging remains gated by successful CI checks."
