name: Validate Android Gradle Configuration

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'package.json'
      - 'yarn.lock'
      - 'patches/**'
      - 'scripts/android-payload-manifest.json'
      - '.github/workflows/android-config-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'package.json'
      - 'yarn.lock'
      - 'patches/**'
      - 'scripts/android-payload-manifest.yml'
      - '.github/workflows/android-config-check.yml'

permissions:
  contents: read

concurrency:
  group: pocketpal-android-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android components
        run: |
          sdkmanager --install \\
            "platform-tools" \\
            "platforms;android-37.0" \\
            "build-tools;37.0.0" \\
            "ndk;27.3.13750724" \\
            "cmake;3.22.1"

          # Android 17 SDK is published as android-37.0, while this project
          # declares compileSdkVersion 37 and Gradle looks for android-37.
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create Android .env file
        run: |
          cat > .env <<'EOL'
          APP_URL=pocketpal://app
          EOL

      - name: Validate Android payload manifest
        run: node scripts/verify-android-payload.js --print-variants

      # Configure only: no C/C++ compilation and no APK/AAB packaging.
      - name: Validate Android Gradle configuration
        run: |
          cd android
          ./gradlew help --no-daemon --stacktrace

      # Discover exact native compile task paths before defining a native-only
      # job. Listing tasks does not execute compilation or packaging.
      - name: Inventory native compilation tasks (no compilation)
        run: |
          set -euo pipefail
          cd android
          ./gradlew tasks --all --no-daemon --console=plain | tee ../android-native-task-inventory.txt
          echo "Candidate native tasks:"
          grep -Ei 'externalNativeBuild|buildCMake|configureCMake|cmake.*(prodRelease|release)|compile.*Native' ../android-native-task-inventory.txt || true
