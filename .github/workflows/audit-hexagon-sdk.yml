name: Audit Hexagon SDK integrity

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-hexagon-sdk/action.yml"
      - ".github/workflows/audit-hexagon-sdk.yml"

permissions:
  contents: read

jobs:
  audit-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download, verify and fingerprint the pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          read_action_default() {
            awk -v key="$1" '
              $0 == "  " key ":" { in_input=1; next }
              in_input && /^    default:/ {
                sub(/^    default:[[:space:]]*/, "")
                print
                exit
              }
              in_input && /^  [^ ]/ { exit }
            ' .github/actions/setup-hexagon-sdk/action.yml
          }

          SDK_VERSION="$(read_action_default sdk-version)"
          TOOLS_VERSION="$(read_action_default tools-version)"
          EXPECTED_TARBALL_SHA256="$(read_action_default sdk-sha256)"
          EXPECTED_CONSUMED_SHA256="$(read_action_default consumed-sha256)"
          for value in "$SDK_VERSION" "$TOOLS_VERSION" "$EXPECTED_TARBALL_SHA256" "$EXPECTED_CONSUMED_SHA256"; do
            if [ -z "$value" ]; then
              echo "::error::Could not read a required pinned value from setup-hexagon-sdk/action.yml"
              exit 1
            fi
          done
          URL="https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v${SDK_VERSION}/hexagon-sdk-v${SDK_VERSION}-amd64-lnx.tar.xz"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          echo "Downloading Hexagon SDK ${SDK_VERSION}"
          curl --fail --location --retry 3 --output "$WORK/sdk.tar.xz" "$URL"
          ACTUAL_TARBALL_SHA256="$(sha256sum "$WORK/sdk.tar.xz" | cut -d' ' -f1)"
          echo "Tarball SHA-256: $ACTUAL_TARBALL_SHA256"
          if [ "$ACTUAL_TARBALL_SHA256" != "$EXPECTED_TARBALL_SHA256" ]; then
            echo "::error::Hexagon SDK tarball checksum mismatch"
            exit 1
          fi

          mkdir "$WORK/unpacked"
          tar --use-compress-program='xz -T0 -d' -xf "$WORK/sdk.tar.xz" -C "$WORK/unpacked"
          if [ -d "$WORK/unpacked/incs" ]; then
            SDK_ROOT="$WORK/unpacked"
          else
            mapfile -t INNER_DIRS < <(find "$WORK/unpacked" -mindepth 1 -maxdepth 1 -type d)
            if [ "${#INNER_DIRS[@]}" -ne 1 ] || [ ! -d "${INNER_DIRS[0]}/incs" ]; then
              echo "::error::Unexpected SDK archive layout"
              find "$WORK/unpacked" -mindepth 1 -maxdepth 2 -print | head -80
              exit 1
            fi
            SDK_ROOT="${INNER_DIRS[0]}"
          fi

          TOOLS_ROOT="$SDK_ROOT/tools/HEXAGON_Tools/$TOOLS_VERSION"
          mapfile -t CONSUMED_PATHS < <(grep -vE '^[[:space:]]*(#|$)' scripts/hexagon-sdk-consumed-paths.txt)
          for relative in "${CONSUMED_PATHS[@]}"; do
            if [ ! -e "$SDK_ROOT/$relative" ]; then
              echo "::error::Build-consumed SDK path is missing: $relative"
              exit 1
            fi
          done
          CONSUMED_SHA256="$(cd "$SDK_ROOT" && tar --sort=name --format=gnu --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - "${CONSUMED_PATHS[@]}" | sha256sum | cut -d' ' -f1)"
          echo "Verified SDK version: $SDK_VERSION"
          echo "Verified tools version: $TOOLS_VERSION"
          echo "Expanded consumed-input SHA-256: $CONSUMED_SHA256"
          if [ "$CONSUMED_SHA256" != "$EXPECTED_CONSUMED_SHA256" ]; then
            echo "::error::Expanded SDK build-input digest does not match setup-hexagon-sdk/action.yml"
            echo "Expected: $EXPECTED_CONSUMED_SHA256"
            echo "Actual:   $CONSUMED_SHA256"
            exit 1
          fi
          echo "OK: archive and all listed Hexagon build inputs match the shared setup action pins."
